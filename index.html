<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nikolas Alvanidis</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Montserrat:wght@300;400;500&family=Playfair+Display:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --fasianos-blue: #1b3d6d;
            --fasianos-red: #b83a24;
            --fasianos-ochre: #d99b26;
            --bg-parchment: #f9f6ee;
            --ink-black: #22201e;
        }

        body {
            background-color: var(--bg-parchment);
            color: var(--ink-black);
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            position: relative;
            overflow-x: hidden;
        }

        /* SVG Background Illustrations (Fasianos inspired) */
        .bg-doodles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .doodle {
            position: absolute;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0.13;
        }

        .sun-top-right {
            top: -20px;
            right: -30px;
            width: 240px;
            height: 240px;
            stroke: var(--fasianos-ochre);
            stroke-width: 2.2;
        }

        .bird-mid-left {
            top: 38%;
            left: 2%;
            width: 130px;
            height: 110px;
            stroke: var(--fasianos-blue);
            stroke-width: 2;
            transform: rotate(-10deg);
        }

        .branch-mid-right {
            top: 65%;
            right: 1.5%;
            width: 140px;
            height: 220px;
            stroke: var(--fasianos-red);
            stroke-width: 2;
        }

        .bird-bottom-left {
            bottom: 4%;
            left: 4%;
            width: 100px;
            height: 90px;
            stroke: var(--fasianos-ochre);
            stroke-width: 2;
            transform: rotate(15deg);
        }

        /* Content layers */
        header, section, footer {
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            padding: 95px 20px 45px;
        }

        .motto {
            font-family: 'Caveat', cursive;
            font-size: 1.6rem;
            color: var(--fasianos-red);
            margin-bottom: 8px;
            letter-spacing: 1px;
            transform: rotate(-1.5deg);
            display: inline-block;
        }

        h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 3.2rem;
            font-weight: 500;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--fasianos-blue);
            margin: 0;
            line-height: 1.2;
        }

        .header-line {
            width: 60px;
            height: 3px;
            background: var(--fasianos-ochre);
            margin: 22px auto 0;
            border-radius: 4px;
        }

        .category-section {
            max-width: 1380px;
            margin: 60px auto;
            padding: 0 25px;
        }

        .category-title {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 2rem;
            font-weight: 500;
            color: var(--fasianos-blue);
            border-bottom: 2px dashed rgba(217, 155, 38, 0.45);
            padding-bottom: 14px;
            margin-bottom: 40px;
            display: flex;
            align-items: baseline;
            gap: 12px;
        }

        .category-title span {
            font-family: 'Caveat', cursive;
            font-size: 1.4rem;
            color: var(--fasianos-red);
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 35px 25px;
        }

        /* Handcrafted Organic Photo Cards */
        .gallery-item {
            background-color: #ffffff;
            padding: 10px 10px 16px 10px;
            box-shadow: 4px 6px 16px rgba(27, 61, 109, 0.08);
            border: 1.5px solid rgba(34, 32, 30, 0.7);
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            aspect-ratio: 3 / 2;
            overflow: hidden;
        }

        .gallery-item:nth-child(even) {
            transform: rotate(0.8deg);
        }
        .gallery-item:nth-child(odd) {
            transform: rotate(-0.8deg);
        }

        .gallery-item:hover {
            transform: scale(1.03) rotate(0deg) !important;
            box-shadow: 6px 12px 24px rgba(184, 58, 36, 0.18);
            border-color: var(--fasianos-red);
            z-index: 4;
        }

        .gallery img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            border-radius: 3px;
            cursor: pointer;
        }

        footer {
            text-align: center;
            padding: 90px 20px 50px;
            font-family: 'Caveat', cursive;
            font-size: 1.4rem;
            letter-spacing: 1.5px;
            color: var(--fasianos-blue);
        }

        /* Lightbox */
        #lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(249, 246, 238, 0.96);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s;
            z-index: 1000;
        }

        #lightbox.visible {
            opacity: 1;
            visibility: visible;
        }

        #lightbox-image {
            max-width: 88%;
            max-height: 82vh;
            border: 8px solid #ffffff;
            box-shadow: 0 15px 35px rgba(27, 61, 109, 0.25);
            border-radius: 4px;
        }

        #lightbox-close {
            position: absolute;
            top: 25px;
            right: 35px;
            font-size: 2.8rem;
            color: var(--fasianos-red);
            background: none;
            border: none;
            cursor: pointer;
            line-height: 1;
        }

        @media (max-width: 768px) {
            h1 { font-size: 2rem; letter-spacing: 2px; }
            .category-title { font-size: 1.6rem; flex-direction: column; gap: 2px; }
            .gallery { grid-template-columns: 1fr; gap: 24px; }
            .gallery-item { transform: none !important; }
            .doodle { display: none; } /* Κρατάει καθαρό το layout στο κινητό */
        }
    </style>
</head>
<body>

    <!-- Subtle Background Art (Fasianos motifs) -->
    <div class="bg-doodles">
        <!-- Sun Motif (Top Right) -->
        <svg class="doodle sun-top-right" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="22" />
            <path d="M50 12 L50 22 M50 78 L50 88 M12 50 L22 50 M78 50 L88 50" />
            <path d="M23 23 L31 31 M69 69 L77 77 M23 77 L31 69 M69 31 L77 23" />
            <path d="M50 28 Q 55 35 50 42" stroke-width="1.5" />
        </svg>

        <!-- Dove / Bird (Mid Left) -->
        <svg class="doodle bird-mid-left" viewBox="0 0 100 80">
            <path d="M10 50 C 25 25, 45 10, 75 18 C 65 30, 50 45, 30 52 C 45 50, 70 58, 85 45 C 90 60, 60 70, 35 65 Z" />
            <path d="M52 22 Q 40 38 48 50" />
        </svg>

        <!-- Laurel / Olive Branch (Mid Right) -->
        <svg class="doodle branch-mid-right" viewBox="0 0 70 140">
            <path d="M35 130 Q 40 70 25 10" />
            <path d="M34 110 Q 55 100 50 85 Q 35 95 33 105" />
            <path d="M35 90 Q 15 80 20 65 Q 35 75 35 85" />
            <path d="M33 65 Q 55 55 48 40 Q 33 50 31 60" />
            <path d="M30 40 Q 10 30 18 15 Q 30 25 28 35" />
        </svg>

        <!-- Second Bird (Bottom Left) -->
        <svg class="doodle bird-bottom-left" viewBox="0 0 100 80">
            <path d="M15 45 C 30 20, 50 12, 78 22 C 65 35, 52 46, 32 50 C 48 50, 68 56, 80 48 C 82 62, 55 68, 30 60 Z" />
        </svg>
    </div>

    <header>
        <div class="motto">Shots by Nikolas Alvanidis</div>
        <h1>More Than An Engineer</h1>
        <div class="header-line"></div>
    </header>

    <section class="category-section">
        <div class="category-title">
            Kraków, Poland <span>(October 2025)</span>
        </div>
        <div class="gallery">
            <div class="gallery-item"><img src="photos for portfolio/photo1.jpg" alt="Krakow shot 1"></div>
            <div class="gallery-item"><img src="photos for portfolio/photo2.jpg" alt="Krakow shot 2"></div>
            <div class="gallery-item"><img src="photos for portfolio/photo3.jpg" alt="Krakow shot 3"></div>
            <div class="gallery-item"><img src="photos for portfolio/photo4.jpg" alt="Krakow shot 4"></div>
            <div class="gallery-item"><img src="photos for portfolio/photo5.jpg" alt="Krakow shot 5"></div>
            <div class="gallery-item"><img src="photos for portfolio/photo6.jpg" alt="Krakow shot 6"></div>
            <div class="gallery-item"><img src="photos for portfolio/photo7.jpg" alt="Krakow shot 7"></div>
            <div class="gallery-item"><img src="photos for portfolio/photo8.jpg" alt="Krakow shot 8"></div>
            <div class="gallery-item"><img src="photos for portfolio/photo9.jpg" alt="Krakow shot 9"></div>
        </div>
    </section>

    <section class="category-section">
        <div class="category-title">
            Athens, Greece <span>(March 2026)</span>
        </div>
        <div class="gallery">
            <div class="gallery-item"><img src="photos for portfolio/photo10.jpg" alt="Athens shot 10"></div>
            <div class="gallery-item"><img src="photos for portfolio/photo11.jpg" alt="Athens shot 11"></div>
            <div class="gallery-item"><img src="photos for portfolio/photo12.jpg" alt="Athens shot 12"></div>
            <div class="gallery-item"><img src="photos for portfolio/photo13.jpg" alt="Athens shot 13"></div>
            <div class="gallery-item"><img src="photos for portfolio/photo14.jpg" alt="Athens shot 14"></div>
            <div class="gallery-item"><img src="photos for portfolio/photo15.jpg" alt="Athens shot 15"></div>
            <div class="gallery-item"><img src="photos for portfolio/photo16.jpg" alt="Athens shot 16"></div>
            <div class="gallery-item"><img src="photos for portfolio/photo17.jpg" alt="Athens shot 17"></div>
            <div class="gallery-item"><img src="photos for portfolio/photo18.jpg" alt="Athens shot 18"></div>
            <div class="gallery-item"><img src="photos for portfolio/photo19.jpg" alt="Athens shot 19"></div>
            <div class="gallery-item"><img src="photos for portfolio/photo20.jpg" alt="Athens shot 20"></div>
            <div class="gallery-item"><img src="photos for portfolio/photo21.jpg" alt="Athens shot 21"></div>
        </div>
    </section>

    <footer>
        NIKOLAS ALVANIDIS &copy; 2026 
    </footer>

    <div id="lightbox">
        <button id="lightbox-close">&times;</button>
        <img id="lightbox-image" src="" alt="Full size preview">
    </div>

    <script>
        const galleryImages = document.querySelectorAll('.gallery img');
        const lightbox = document.getElementById('lightbox');
        const lightboxImage = document.getElementById('lightbox-image');
        const lightboxClose = document.getElementById('lightbox-close');

        galleryImages.forEach(image => {
            image.addEventListener('click', () => {
                lightboxImage.src = image.src;
                lightbox.classList.add('visible');
                document.body.style.overflow = 'hidden';
            });
        });

        const closeLightbox = () => {
            lightbox.classList.remove('visible');
            document.body.style.overflow = '';
        };

        lightboxClose.addEventListener('click', closeLightbox);
        lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });
    </script>

</body>
</html>
