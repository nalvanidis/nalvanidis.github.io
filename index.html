<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nikolas Alvanidis</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Montserrat:wght@300;400;500&family=Playfair+Display:ital,wght@0,600;0,700&display=swap" rel="stylesheet">

    <style>
        :root {
            --fasianos-blue: #163663;
            --fasianos-red: #ba3826;
            --fasianos-ochre: #d69424;
            --fasianos-amber: #c46824;
            --bg-parchment: #f9f6ee;
            --ink-black: #22201e;
        }

        body {
            background-color: var(--bg-parchment);
            color: var(--ink-black);
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            position: relative;
            overflow-x: hidden;
        }

        /* SVG Background Illustrations (Fasianos motifs) */
        .bg-doodles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .doodle {
            position: absolute;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0.14;
        }

        /* 1. Ήλιος */
        .sun-top-right {
            top: -15px;
            right: -25px;
            width: 250px;
            height: 250px;
            stroke: var(--fasianos-ochre);
            stroke-width: 2.2;
        }

        /* 2. Πουλί αριστερά */
        .bird-mid-left {
            top: 25%;
            left: 2%;
            width: 130px;
            height: 110px;
            stroke: var(--fasianos-blue);
            stroke-width: 2;
            transform: rotate(-8deg);
        }

        /* 3. Κλαδί δεξιά */
        .branch-mid-right {
            top: 35%;
            right: 1.5%;
            width: 130px;
            height: 200px;
            stroke: var(--fasianos-red);
            stroke-width: 2;
        }

        /* 4. Κύματα ανέμου / κορδέλα */
        .wind-mid {
            top: 55%;
            left: -30px;
            width: 180px;
            height: 120px;
            stroke: var(--fasianos-ochre);
            stroke-width: 1.8;
        }

        /* 5. Δεύτερο πουλί */
        .bird-lower-right {
            top: 72%;
            right: 4%;
            width: 110px;
            height: 90px;
            stroke: var(--fasianos-blue);
            stroke-width: 2;
            transform: rotate(12deg);
        }

        /* 6. Ποδήλατο (Χαρακτηριστικό μοτίβο Φασιανού) */
        .bike-bottom-left {
            bottom: 3%;
            left: 2.5%;
            width: 170px;
            height: 120px;
            stroke: var(--fasianos-red);
            stroke-width: 2.2;
        }

        /* Content layers */
        header, section, footer {
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            padding: 95px 20px 45px;
            min-height: 160px;
        }

        .motto {
            font-family: 'Caveat', cursive;
            font-size: 1.65rem;
            color: var(--fasianos-red);
            margin-bottom: 12px;
            letter-spacing: 1px;
            transform: rotate(-1.5deg);
            display: inline-block;
        }

        /* Typewriter Title Styling */
        h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 3.2rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin: 0;
            line-height: 1.25;
            min-height: 1.25em; /* Αποτρέπει το jump στο layout */
        }

        /* Χρώματα γραμμάτων */
        .c-blue   { color: var(--fasianos-blue); }
        .c-red    { color: var(--fasianos-red); }
        .c-ochre  { color: var(--fasianos-ochre); }
        .c-amber  { color: var(--fasianos-amber); }

        /* Κέρσορας γραφομηχανής */
        .cursor {
            display: inline-block;
            width: 4px;
            height: 0.9em;
            background-color: var(--fasianos-blue);
            margin-left: 6px;
            vertical-align: baseline;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .header-line {
            width: 60px;
            height: 3px;
            background: var(--fasianos-ochre);
            margin: 22px auto 0;
            border-radius: 4px;
        }

        .category-section {
            max-width: 1380px;
            margin: 60px auto;
            padding: 0 25px;
        }

        .category-title {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 2rem;
            font-weight: 600;
            color: var(--fasianos-blue);
            border-bottom: 2px dashed rgba(214, 148, 36, 0.5);
            padding-bottom: 14px;
            margin-bottom: 40px;
            display: flex;
            align-items: baseline;
            gap: 12px;
        }

        .category-title span {
            font-family: 'Caveat', cursive;
            font-size: 1.45rem;
            color: var(--fasianos-red);
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 35px 25px;
        }

        /* Χειροποίητη κάρτα φωτογραφίας */
        .gallery-item {
            background-color: #ffffff;
            padding: 10px 10px 16px 10px;
            box-shadow: 4px 6px 16px rgba(22, 54, 99, 0.08);
            border: 1.5px solid rgba(34, 32, 30, 0.7);
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            aspect-ratio: 3 / 2;
            overflow: hidden;
        }

        .gallery-item:nth-child(even) { transform: rotate(0.8deg); }
        .gallery-item:nth-child(odd) { transform: rotate(-0.8deg); }

        .gallery-item:hover {
            transform: scale(1.03) rotate(0deg) !important;
            box-shadow: 6px 12px 24px rgba(186, 56, 38, 0.18);
            border-color: var(--fasianos-red);
            z-index: 4;
        }

        .gallery img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            border-radius: 3px;
            cursor: pointer;
        }

        footer {
            text-align: center;
            padding: 90px 20px 50px;
            font-family: 'Caveat', cursive;
            font-size: 1.45rem;
            letter-spacing: 1.5px;
            color: var(--fasianos-blue);
        }

        /* Lightbox */
        #lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(249, 246, 238, 0.96);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s;
            z-index: 1000;
        }

        #lightbox.visible {
            opacity: 1;
            visibility: visible;
        }

        #lightbox-image {
            max-width: 88%;
            max-height: 82vh;
            border: 8px solid #ffffff;
            box-shadow: 0 15px 35px rgba(22, 54, 99, 0.25);
            border-radius: 4px;
        }

        #lightbox-close {
            position: absolute;
            top: 25px;
            right: 35px;
            font-size: 2.8rem;
            color: var(--fasianos-red);
            background: none;
            border: none;
            cursor: pointer;
            line-height: 1;
        }

        @media (max-width: 768px) {
            h1 { font-size: 2rem; letter-spacing: 2px; }
            .category-title { font-size: 1.6rem; flex-direction: column; gap: 2px; }
            .gallery { grid-template-columns: 1fr; gap: 24px; }
            .gallery-item { transform: none !important; }
            .doodle { display: none; }
        }
    </style>
</head>
<body>

    <!-- Subtle Fasianos Background Art -->
    <div class="bg-doodles">
        <!-- Ήλιος -->
        <svg class="doodle sun-top-right" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="22" />
            <path d="M50 12 L50 22 M50 78 L50 88 M12 50 L22 50 M78 50 L88 50" />
            <path d="M23 23 L31 31 M69 69 L77 77 M23 77 L31 69 M69 31 L77 23" />
            <path d="M50 28 Q 55 35 50 42" stroke-width="1.5" />
        </svg>

        <!-- Πουλί 1 -->
        <svg class="doodle bird-mid-left" viewBox="0 0 100 80">
            <path d="M10 50 C 25 25, 45 10, 75 18 C 65 30, 50 45, 30 52 C 45 50, 70 58, 85 45 C 90 60, 60 70, 35 65 Z" />
            <path d="M52 22 Q 40 38 48 50" />
        </svg>

        <!-- Κλαδί ελιάς/δάφνης -->
        <svg class="doodle branch-mid-right" viewBox="0 0 70 140">
            <path d="M35 130 Q 40 70 25 10" />
            <path d="M34 110 Q 55 100 50 85 Q 35 95 33 105" />
            <path d="M35 90 Q 15 80 20 65 Q 35 75 35 85" />
            <path d="M33 65 Q 55 55 48 40 Q 33 50 31 60" />
            <path d="M30 40 Q 10 30 18 15 Q 30 25 28 35" />
        </svg>

        <!-- Κύματα ανέμου -->
        <svg class="doodle wind-mid" viewBox="0 0 120 60">
            <path d="M10 20 Q 35 5 60 20 T 110 20" />
            <path d="M20 40 Q 45 25 70 40 T 120 40" />
        </svg>

        <!-- Πουλί 2 -->
        <svg class="doodle bird-lower-right" viewBox="0 0 100 80">
            <path d="M15 45 C 30 20, 50 12, 78 22 C 65 35, 52 46, 32 50 C 48 50, 68 56, 80 48 C 82 62, 55 68, 30 60 Z" />
        </svg>

        <!-- Ποδήλατο (Fasianos bicycle motif) -->
        <svg class="doodle bike-bottom-left" viewBox="0 0 120 80">
            <!-- Ρόδες -->
            <circle cx="28" cy="55" r="18" />
            <circle cx="92" cy="55" r="18" />
            <!-- Σκελετός & Τιμόνι -->
            <path d="M28 55 L52 55 L75 30 L45 30 Z" />
            <path d="M52 55 L45 22" />
            <path d="M92 55 L75 30 L80 18 L70 18" />
            <!-- Σέλα -->
            <path d="M40 22 L52 22" stroke-width="3" />
        </svg>
    </div>

    <header>
        <div class="motto">Shots by Nikolas Alvanidis</div>
        <!-- Typewriter Title Container -->
        <h1><span id="typewriter-text"></span><span class="cursor" id="typewriter-cursor"></span></h1>
        <div class="header-line"></div>
    </header>

    <section class="category-section">
        <div class="category-title">
            Kraków, Poland <span>(October 2025)</span>
        </div>
        <div class="gallery">
            <div class="gallery-item"><img src="photos for portfolio/photo1.jpg" alt="Krakow shot 1"></div>
            <div class="gallery-item"><img src="photos for portfolio/photo2.jpg" alt="Krakow shot 2"></div>
            <div class="gallery-item"><img src="photos for portfolio/photo3.jpg" alt="Krakow shot 3"></div>
            <div class="gallery-item"><img src="photos for portfolio/photo4.jpg" alt="Krakow shot 4"></div>
            <div class="gallery-item"><img src="photos for portfolio/photo5.jpg" alt="Krakow shot 5"></div>
            <div class="gallery-item"><img src="photos for portfolio/photo6.jpg" alt="Krakow shot 6"></div>
            <div class="gallery-item"><img src="photos for portfolio/photo7.jpg" alt="Krakow shot 7"></div>
            <div class="gallery-item"><img src="photos for portfolio/photo8.jpg" alt="Krakow shot 8"></div>
            <div class="gallery-item"><img src="photos for portfolio/photo9.jpg" alt="Krakow shot 9"></div>
        </div>
    </section>

    <section class="category-section">
        <div class="category-title">
            Athens, Greece <span>(March 2026)</span>
        </div>
        <div class="gallery">
            <div class="gallery-item"><img src="photos for portfolio/photo10.jpg" alt="Athens shot 10"></div>
            <div class="gallery-item"><img src="photos for portfolio/photo11.jpg" alt="Athens shot 11"></div>
            <div class="gallery-item"><img src="photos for portfolio/photo12.jpg" alt="Athens shot 12"></div>
            <div class="gallery-item"><img src="photos for portfolio/photo13.jpg" alt="Athens shot 13"></div>
            <div class="gallery-item"><img src="photos for portfolio/photo14.jpg" alt="Athens shot 14"></div>
            <div class="gallery-item"><img src="photos for portfolio/photo15.jpg" alt="Athens shot 15"></div>
            <div class="gallery-item"><img src="photos for portfolio/photo16.jpg" alt="Athens shot 16"></div>
            <div class="gallery-item"><img src="photos for portfolio/photo17.jpg" alt="Athens shot 17"></div>
            <div class="gallery-item"><img src="photos for portfolio/photo18.jpg" alt="Athens shot 18"></div>
            <div class="gallery-item"><img src="photos for portfolio/photo19.jpg" alt="Athens shot 19"></div>
            <div class="gallery-item"><img src="photos for portfolio/photo20.jpg" alt="Athens shot 20"></div>
            <div class="gallery-item"><img src="photos for portfolio/photo21.jpg" alt="Athens shot 21"></div>
        </div>
    </section>

    <footer>
        NIKOLAS ALVANIDIS &copy; 2026 
    </footer>

    <div id="lightbox">
        <button id="lightbox-close">&times;</button>
        <img id="lightbox-image" src="" alt="Full size preview">
    </div>

    <script>
        /* Colorful Typewriter Effect with Fasianos Palette */
        const textToType = "MORE THAN AN ENGINEER";
        const colorClasses = ['c-blue', 'c-red', 'c-ochre', 'c-amber'];
        const textContainer = document.getElementById('typewriter-text');
        const cursor = document.getElementById('typewriter-cursor');
        
        let charIndex = 0;
        let colorCounter = 0;

        function typeLetter() {
            if (charIndex < textToType.length) {
                const char = textToType[charIndex];
                
                if (char === ' ') {
                    textContainer.appendChild(document.createTextNode(' '));
                } else {
                    const span = document.createElement('span');
                    span.textContent = char;
                    span.className = colorClasses[colorCounter % colorClasses.length];
                    textContainer.appendChild(span);
                    colorCounter++;
                }
                
                charIndex++;
                // Φυσικός ρυθμός πληκτρολόγησης (70ms - 110ms)
                setTimeout(typeLetter, Math.random() * 40 + 70);
            } else {
                // Όταν τελειώσει, ο κέρσορας αναβοσβήνει για λίγο και μετά κρύβεται
                setTimeout(() => {
                    cursor.style.transition = 'opacity 0.6s ease';
                    cursor.style.opacity = '0';
                }, 2000);
            }
        }

        // Εκκίνηση typewriter μόλις φορτώσει η σελίδα
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(typeLetter, 300);
        });

        /* Lightbox functionality */
        const galleryImages = document.querySelectorAll('.gallery img');
        const lightbox = document.getElementById('lightbox');
        const lightboxImage = document.getElementById('lightbox-image');
        const lightboxClose = document.getElementById('lightbox-close');

        galleryImages.forEach(image => {
            image.addEventListener('click', () => {
                lightboxImage.src = image.src;
                lightbox.classList.add('visible');
                document.body.style.overflow = 'hidden';
            });
        });

        const closeLightbox = () => {
            lightbox.classList.remove('visible');
            document.body.style.overflow = '';
        };

        lightboxClose.addEventListener('click', closeLightbox);
        lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });
    </script>

</body>
</html>
