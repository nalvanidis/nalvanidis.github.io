<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nikolas Alvanidis</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Cinzel+Decorative:wght@700&family=GFS+Didot&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --fasianos-blue: #1b3d6d;
            --fasianos-red: #c13b2a;
            --fasianos-ochre: #e09f3e;
            --bg-parchment: #fdf8ee;
            --ink-black: #1f1d1d;
        }

        body {
            background-color: var(--bg-parchment);
            color: var(--ink-black);
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            background-image: radial-gradient(#e4dac5 1px, transparent 1px);
            background-size: 28px 28px;
        }

        header {
            text-align: center;
            padding: 90px 20px 50px;
            position: relative;
        }

        .motto {
            font-family: 'Caveat', cursive;
            font-size: 1.8rem;
            color: var(--fasianos-red);
            margin-bottom: 8px;
            letter-spacing: 1px;
            transform: rotate(-2deg);
        }

        h1 {
            font-family: 'Cinzel Decorative', serif;
            font-size: 4rem;
            margin: 0;
            color: var(--fasianos-blue);
            text-transform: uppercase;
            letter-spacing: 2px;
            line-height: 1.1;
            text-shadow: 3px 3px 0 var(--fasianos-ochre);
        }

        .header-decor {
            width: 90px;
            height: 6px;
            background: var(--fasianos-red);
            margin: 25px auto 0;
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
        }

        .category-section {
            max-width: 1350px;
            margin: 70px auto;
            padding: 0 25px;
        }

        .category-title {
            font-family: 'GFS Didot', serif;
            font-size: 2.3rem;
            color: var(--fasianos-blue);
            border-bottom: 3px dashed var(--fasianos-ochre);
            padding-bottom: 12px;
            margin-bottom: 45px;
            display: flex;
            align-items: baseline;
            gap: 15px;
        }

        .category-title span {
            font-family: 'Caveat', cursive;
            font-size: 1.6rem;
            color: var(--fasianos-red);
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 40px 30px;
            padding: 10px;
        }

        /* Organic Handcrafted Frame */
        .gallery-item {
            background-color: #fff;
            padding: 12px 12px 18px 12px;
            box-shadow: 5px 8px 18px rgba(27, 61, 109, 0.12);
            border: 2px solid var(--ink-black);
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease;
            aspect-ratio: 3 / 2;
            overflow: hidden;
        }

        /* Subtle chaotic rotations */
        .gallery-item:nth-child(3n+1) { transform: rotate(-1.5deg); }
        .gallery-item:nth-child(3n+2) { transform: rotate(1.2deg); }
        .gallery-item:nth-child(3n+3) { transform: rotate(-0.8deg); }

        .gallery-item:hover {
            transform: scale(1.04) rotate(0deg) !important;
            box-shadow: 8px 14px 24px rgba(193, 59, 42, 0.25);
            border-color: var(--fasianos-red);
            z-index: 5;
        }

        .gallery img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            border-radius: 4px;
            cursor: pointer;
        }

        footer {
            text-align: center;
            padding: 100px 20px 60px;
            font-family: 'Caveat', cursive;
            font-size: 1.5rem;
            letter-spacing: 2px;
            color: var(--fasianos-blue);
        }

        #lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(253, 248, 238, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s;
            z-index: 1000;
        }

        #lightbox.visible {
            opacity: 1;
            visibility: visible;
        }

        #lightbox-image {
            max-width: 85%;
            max-height: 80vh;
            border: 10px solid #fff;
            box-shadow: 0 15px 35px rgba(27, 61, 109, 0.3);
            border-radius: 4px;
        }

        #lightbox-close {
            position: absolute;
            top: 25px;
            right: 35px;
            font-size: 3rem;
            color: var(--fasianos-red);
            background: none;
            border: none;
            cursor: pointer;
            line-height: 1;
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.3rem; }
            .category-title { font-size: 1.7rem; flex-direction: column; gap: 0; }
            .gallery { grid-template-columns: 1fr; gap: 25px; }
            .gallery-item { transform: none !important; }
        }
    </style>
</head>
<body>

    <header>
        <div class="motto">Shots by Nikolas Alvanidis</div>
        <h1>More Than An Engineer</h1>
        <div class="header-decor"></div>
    </header>

    <section class="category-section">
        <div class="category-title">
            Kraków, Poland <span>(October 2025)</span>
        </div>
        <div class="gallery">
            <div class="gallery-item"><img src="photos for portfolio/photo1.jpg"></div>
            <div class="gallery-item"><img src="photos for portfolio/photo2.jpg"></div>
            <div class="gallery-item"><img src="photos for portfolio/photo3.jpg"></div>
            <div class="gallery-item"><img src="photos for portfolio/photo4.jpg"></div>
            <div class="gallery-item"><img src="photos for portfolio/photo5.jpg"></div>
            <div class="gallery-item"><img src="photos for portfolio/photo6.jpg"></div>
            <div class="gallery-item"><img src="photos for portfolio/photo7.jpg"></div>
            <div class="gallery-item"><img src="photos for portfolio/photo8.jpg"></div>
            <div class="gallery-item"><img src="photos for portfolio/photo9.jpg"></div>
        </div>
    </section>

    <section class="category-section">
        <div class="category-title">
            Athens, Greece <span>(March 2026)</span>
        </div>
        <div class="gallery">
            <div class="gallery-item"><img src="photos for portfolio/photo10.jpg"></div>
            <div class="gallery-item"><img src="photos for portfolio/photo11.jpg"></div>
            <div class="gallery-item"><img src="photos for portfolio/photo12.jpg"></div>
            <div class="gallery-item"><img src="photos for portfolio/photo13.jpg"></div>
            <div class="gallery-item"><img src="photos for portfolio/photo14.jpg"></div>
            <div class="gallery-item"><img src="photos for portfolio/photo15.jpg"></div>
            <div class="gallery-item"><img src="photos for portfolio/photo16.jpg"></div>
            <div class="gallery-item"><img src="photos for portfolio/photo17.jpg"></div>
            <div class="gallery-item"><img src="photos for portfolio/photo18.jpg"></div>
            <div class="gallery-item"><img src="photos for portfolio/photo19.jpg"></div>
            <div class="gallery-item"><img src="photos for portfolio/photo20.jpg"></div>
            <div class="gallery-item"><img src="photos for portfolio/photo21.jpg"></div>
        </div>
    </section>

    <footer>
        NIKOLAS ALVANIDIS &copy; 2026 
    </footer>

    <div id="lightbox">
        <button id="lightbox-close">&times;</button>
        <img id="lightbox-image" src="" alt="Full size">
    </div>

    <script>
        const galleryImages = document.querySelectorAll('.gallery img');
        const lightbox = document.getElementById('lightbox');
        const lightboxImage = document.getElementById('lightbox-image');
        const lightboxClose = document.getElementById('lightbox-close');

        galleryImages.forEach(image => {
            image.addEventListener('click', () => {
                lightboxImage.src = image.src;
                lightbox.classList.add('visible');
                document.body.style.overflow = 'hidden';
            });
        });

        const closeLightbox = () => {
            lightbox.classList.remove('visible');
            document.body.style.overflow = '';
        };

        lightboxClose.addEventListener('click', closeLightbox);
        lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });
    </script>

</body>
</html>
